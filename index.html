<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizJavaScript</title>
    <link rel="stylesheet" href="./style.css"
</head>
<body>
    <!-- Division general de la pagina -->
    <div id="container"> 
        <!-- division del encabezado o Foto inicial  -->
        <div id="encabezado">
        </div>
        <!-- Division para el cuerpo  -->
        <div id="cuerpo"> 
            <!-- Barra uno donde alberga 3 botones -->
            <div id="barra-one">
                <div id="today">
                    <button id="to">Today</button>
                </div>
                <div id="tomorrow">
                    <button id="tom">Tomorrow</button>
                </div>
                <div id="days10">
                    <button id="day">10 Days</button>
                </div>
            </div>
            <!-- Barra dos donde alberga 2 item mas! -->
            <div id="barra-two">
                <div id="velocidadviento">
                    <h2>Wind Speed</h2>
                </div>
                <div id="precipataciones">
                    <h2>Rain Chance</h2>
                </div>
            </div>
            <!-- Barra 3 donde alberga 3 item mas! -->
            <div id="barra-three">
                <div id="pressure">
                    <h2>Pressure</h2>
                </div>
                <div id="UVindex">
                    <h2>UV Index</h2>
                </div>
            </div>
            <div id="pronosticoxhora">
                <h2>Hourly Forecast</h2>
            </div>
            <div id="pronosticoxdias">
                <h2>Day Forecast</h2>
            </div>
            <div id="probabilidaddelluvia">
                <h2>Chance of rain</h2>
            </div>
            <div id="tiempos">
                <div id="amanecer">
                    <h2>Sunrise</h2>
                </div>
                <div id="atardecer">
                    <h2>Sunset</h2>
                </div>
            </div>
        </div>
    </div>

 <!--  -->


</body>
<!-- se enlaza modulando a script -->
<script src="./script.js"></script> 

</html>
